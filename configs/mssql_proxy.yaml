# TCP listener on :11433 for MS SQL Server clients, backend 127.0.0.1:1433
# (a local SQL Server, e.g. the mcr.microsoft.com/mssql/server container).
#
# tls_inspector splits clients by their first bytes:
# - TDS 8.0 strict starts with a TLS ClientHello: passed through by tcp_proxy
#   alone (stat prefix mssql_strict).
# - TDS 7.x starts with a plain PRELOGIN packet: runs through the mssql_proxy
#   dynamic module, then tcp_proxy (stat prefix mssql).
# Envoy loads ${ENVOY_DYNAMIC_MODULES_SEARCH_PATH}/libmssql_proxy.so.
#
# As configured here the module only observes. To have it terminate TLS on
# both legs (needed to read LOGIN7 when the client encrypts), give it a
# filter_config (see modules/mssql_proxy/config.h):
#
#   filter_config:
#     "@type": type.googleapis.com/google.protobuf.Struct
#     value:
#       tls:
#         cert_file: /etc/mssql_proxy/proxy.pem     # presented to clients
#         key_file: /etc/mssql_proxy/proxy.key
#         upstream_ca_file: /etc/mssql_proxy/sql.pem  # CAs or the server's own cert
#         upstream_server_name: sql.example.com     # optional SNI and name check
#
# tests/mssql_server_test.sh runs every client both ways.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
  - name: mssql
    address:
      socket_address: { address: 0.0.0.0, port_value: 11433 }
    listener_filters:
    - name: envoy.filters.listener.tls_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    filter_chains:
    - filter_chain_match:
        transport_protocol: tls
      filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: mssql_strict
          cluster: mssql_backend
    - filter_chain_match:
        transport_protocol: raw_buffer
      filters:
      - name: mssql_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.dynamic_modules.v3.DynamicModuleNetworkFilter
          dynamic_module_config:
            name: mssql_proxy
          filter_name: mssql_proxy
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: mssql
          cluster: mssql_backend

  clusters:
  - name: mssql_backend
    connect_timeout: 5s
    type: STATIC
    load_assignment:
      cluster_name: mssql_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 1433 }
